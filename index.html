<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiKabu | Sistem Informasi Fogging Ceria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        'fog-yellow': '#FFD166',
                        'fog-blue': '#118AB2',
                        'fog-green': '#06D6A0',
                        'fog-red': '#EF476F',
                        'fog-dark': '#073B4C',
                    },
                    boxShadow: {
                        'soft': '0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #F8F9FA;
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }

        /* Styling Print */
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            /* Hilangkan background color setting dari browser saat print jika memungkinkan */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        /* Animasi sederhana */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <!-- Kontainer Utama Aplikasi -->
    <div id="app" class="flex-grow flex flex-col w-full max-w-md mx-auto sm:max-w-4xl bg-white min-h-screen sm:shadow-2xl relative overflow-hidden print:hidden">
        <!-- Konten akan dirender oleh JavaScript di sini -->
    </div>

    <!-- Kontainer Khusus untuk Mode Print -->
    <div id="print-container" class="hidden print:block w-full bg-white text-black p-0 m-0">
        <!-- Konten cetak akan diinjeksi di sini -->
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // State Aplikasi Global
        window.state = {
            isAppReady: false,
            isLoggedIn: false,
            currentView: 'dashboard', // dashboard, transactions, reports, settings
            appPassword: 'admin',
            logoUrl: null,
            companyAddress: 'Layanan Fogging Ceria & Profesional\nJl. Sehat Selalu No. 99, Kota Bersih\nTelp: 0812-3456-7890',
            ownerName: 'Manajemen SiKabu',
            signatureUrl: null,
            previewTxId: null,
            transactions: [],
            editingId: null,
            filterMonth: new Date().toISOString().substring(0, 7)
        };
        const state = window.state;

        // Firebase Cloud Variables
        let db, auth, userId;
        const dummyData = [
            { id: 't1', type: 'income', date: '2026-08-24', amount: 350000, customer: 'Bapak Budi', address: 'Jl. Merdeka No. 10', notes: 'Fogging rumah 2 lantai' },
            { id: 't2', type: 'expense', date: '2026-08-24', amount: 150000, notes: 'Beli obat nyamuk 2 liter', category: 'Bahan' },
            { id: 't3', type: 'income', date: '2026-08-20', amount: 500000, customer: 'SDN 01 Pagi', address: 'Jl. Pendidikan', notes: 'Fogging seluruh area sekolah' }
        ];

        // Inisialisasi Cloud Storage
        async function initCloud() {
            try {
                if (typeof __firebase_config !== 'undefined') {
                    const config = JSON.parse(__firebase_config);
                    if (Object.keys(config).length > 0) {
                        const app = initializeApp(config);
                        db = getFirestore(app);
                        auth = getAuth(app);
                        const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                        
                        if (token) await signInWithCustomToken(auth, token);
                        else await signInAnonymously(auth);
                        
                        userId = auth.currentUser.uid;
                        await loadCloudData();
                    }
                }
            } catch (e) {
                console.error("Cloud Error", e);
            } finally {
                state.isAppReady = true;
                if (state.transactions.length === 0) state.transactions = dummyData;
                window.render();
            }
        }

        // Muat Data dari Cloud
        async function loadCloudData() {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'fogging-app';
            
            // Pengaturan
            const sRef = doc(db, 'artifacts', appId, 'users', userId, 'config', 'settings');
            const sSnap = await getDoc(sRef);
            if (sSnap.exists()) {
                const d = sSnap.data();
                if(d.appPassword) state.appPassword = d.appPassword;
                if(d.logoUrl) state.logoUrl = d.logoUrl;
                if(d.companyAddress) state.companyAddress = d.companyAddress;
                if(d.ownerName) state.ownerName = d.ownerName;
                if(d.signatureUrl) state.signatureUrl = d.signatureUrl;
            }
            
            // Transaksi
            const tRef = collection(db, 'artifacts', appId, 'users', userId, 'transactions');
            const tSnap = await getDocs(tRef);
            let arr = [];
            tSnap.forEach(d => arr.push(d.data()));
            if (arr.length > 0) state.transactions = arr;
        }

        // Fungsi Simpan ke Cloud
        window.saveSettingsToCloud = async function() {
            if (!db || !userId) return;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'fogging-app';
            const sRef = doc(db, 'artifacts', appId, 'users', userId, 'config', 'settings');
            await setDoc(sRef, {
                appPassword: state.appPassword,
                logoUrl: state.logoUrl,
                companyAddress: state.companyAddress,
                ownerName: state.ownerName,
                signatureUrl: state.signatureUrl
            });
        }

        window.saveTxToCloud = async function(data) {
            if (!db || !userId) return;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'fogging-app';
            const tRef = doc(db, 'artifacts', appId, 'users', userId, 'transactions', data.id);
            await setDoc(tRef, data);
        }

        window.deleteTxFromCloud = async function(id) {
            if (!db || !userId) return;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'fogging-app';
            const tRef = doc(db, 'artifacts', appId, 'users', userId, 'transactions', id);
            await deleteDoc(tRef);
        }

        // Image Resizer Helper agar ukuran tidak terlalu besar di Database
        window.resizeImage = function(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400;
                    const MAX_HEIGHT = 400;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    } else if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        height = MAX_HEIGHT;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/png', 0.8)); // Kompresi otomatis
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        // Helpers
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        };

        const formatDate = (dateString) => {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('id-ID', options);
        };

        const generateId = () => 'id_' + Math.random().toString(36).substr(2, 9);

        // Core Render Function
        window.render = function() {
            const appContainer = document.getElementById('app');

            if (!state.isAppReady) {
                appContainer.innerHTML = `
                    <div class="flex-grow flex items-center justify-center flex-col gap-4 h-screen bg-slate-50">
                        <div class="w-16 h-16 border-4 border-gray-200 border-t-fog-blue rounded-full animate-spin"></div>
                        <p class="text-gray-500 font-bold animate-pulse text-sm">Menyiapkan Sistem Ceria...</p>
                    </div>`;
                return;
            }

            if (!state.isLoggedIn) {
                appContainer.innerHTML = getLoginHTML();
                window.attachEventListeners();
                return;
            }

            let html = '';
            html += getHeaderHTML();

            html += `<main class="flex-grow overflow-y-auto p-4 sm:p-8 bg-slate-50/50 pb-24 sm:pb-8 fade-in" id="main-content">`;
            
            if (state.currentView === 'dashboard') html += getDashboardHTML();
            else if (state.currentView === 'transactions') html += getTransactionsHTML();
            else if (state.currentView === 'reports') html += getReportsHTML();
            else if (state.currentView === 'settings') html += getSettingsHTML();
            
            html += `</main>`;

            html += getBottomNavHTML();
            html += getTransactionModalHTML();
            html += getInvoicePreviewModalHTML();

            appContainer.innerHTML = html;
            window.attachEventListeners();
        }

        // View Generators
        function getLoginHTML() {
            return `
                <div class="flex-grow flex items-center justify-center p-6 bg-gradient-to-br from-fog-yellow/30 to-fog-blue/30 h-screen">
                    <div class="bg-white p-8 rounded-3xl shadow-soft w-full max-w-sm text-center fade-in">
                        <div class="w-20 h-20 bg-fog-yellow rounded-full mx-auto flex items-center justify-center shadow-lg mb-6 text-fog-dark">
                            <i class="fas fa-spray-can text-4xl"></i>
                        </div>
                        <h1 class="text-3xl font-extrabold text-fog-dark mb-2">SiKabu</h1>
                        <p class="text-gray-500 mb-8 text-sm">Sistem Informasi Fogging Ceria</p>
                        
                        <form id="login-form" class="space-y-4">
                            <div>
                                <input type="text" id="username" placeholder="Username (isi: admin)" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-fog-blue focus:border-transparent transition-all" required>
                            </div>
                            <div class="relative">
                                <input type="password" id="password" placeholder="Password Login..." class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-fog-blue focus:border-transparent transition-all pr-12" required>
                                <button type="button" onclick="togglePassword()" class="absolute right-4 top-3.5 text-gray-400 hover:text-fog-blue transition-colors outline-none">
                                    <i class="fas fa-eye" id="eye-icon"></i>
                                </button>
                            </div>
                            <button type="submit" class="w-full bg-fog-blue text-white font-bold py-3 rounded-xl hover:bg-opacity-90 shadow-lg shadow-fog-blue/30 transition-all transform active:scale-95">
                                Masuk Yuk!
                            </button>
                        </form>
                        <div id="login-error" class="hidden mt-4 text-fog-red text-sm font-semibold">Username atau Password salah.</div>
                    </div>
                </div>
            `;
        }

        function getHeaderHTML() {
            const titles = {
                'dashboard': 'Beranda Ceria',
                'transactions': 'Catatan Transaksi',
                'reports': 'Laporan Keuangan',
                'settings': 'Pengaturan'
            };
            return `
                <header class="bg-white px-6 py-4 shadow-sm flex justify-between items-center z-10 sticky top-0">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-fog-yellow rounded-full flex items-center justify-center text-fog-dark shadow-sm">
                            <i class="fas fa-spray-can"></i>
                        </div>
                        <h1 class="font-bold text-xl text-fog-dark hidden sm:block">SiKabu</h1>
                        <h1 class="font-bold text-lg text-fog-dark sm:hidden">${titles[state.currentView]}</h1>
                    </div>
                    
                    <!-- Desktop Nav -->
                    <nav class="hidden sm:flex gap-2">
                        <button onclick="navigate('dashboard')" class="px-4 py-2 rounded-lg font-semibold transition-colors ${state.currentView === 'dashboard' ? 'bg-fog-blue text-white' : 'text-gray-600 hover:bg-gray-100'}">Beranda</button>
                        <button onclick="navigate('transactions')" class="px-4 py-2 rounded-lg font-semibold transition-colors ${state.currentView === 'transactions' ? 'bg-fog-blue text-white' : 'text-gray-600 hover:bg-gray-100'}">Transaksi</button>
                        <button onclick="navigate('reports')" class="px-4 py-2 rounded-lg font-semibold transition-colors ${state.currentView === 'reports' ? 'bg-fog-blue text-white' : 'text-gray-600 hover:bg-gray-100'}">Laporan</button>
                        <button onclick="navigate('settings')" class="px-4 py-2 rounded-lg font-semibold transition-colors ${state.currentView === 'settings' ? 'bg-fog-blue text-white' : 'text-gray-600 hover:bg-gray-100'}"><i class="fas fa-cog"></i></button>
                    </nav>

                    <button onclick="logout()" class="text-gray-400 hover:text-fog-red transition-colors" title="Keluar">
                        <i class="fas fa-sign-out-alt text-xl"></i>
                    </button>
                </header>
            `;
        }

        function getBottomNavHTML() {
            return `
                <nav class="sm:hidden fixed bottom-0 w-full max-w-md mx-auto bg-white border-t border-gray-100 flex justify-around p-3 pb-safe shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-20">
                    <button onclick="navigate('dashboard')" class="flex flex-col items-center justify-center w-16 transition-colors ${state.currentView === 'dashboard' ? 'text-fog-blue' : 'text-gray-400'}">
                        <i class="fas fa-home text-xl mb-1"></i>
                        <span class="text-[10px] font-semibold">Beranda</span>
                    </button>
                    <button onclick="navigate('transactions')" class="flex flex-col items-center justify-center w-16 transition-colors ${state.currentView === 'transactions' ? 'text-fog-blue' : 'text-gray-400'}">
                        <i class="fas fa-list-alt text-xl mb-1"></i>
                        <span class="text-[10px] font-semibold">Transaksi</span>
                    </button>
                    <button onclick="navigate('reports')" class="flex flex-col items-center justify-center w-16 transition-colors ${state.currentView === 'reports' ? 'text-fog-blue' : 'text-gray-400'}">
                        <i class="fas fa-chart-pie text-xl mb-1"></i>
                        <span class="text-[10px] font-semibold">Laporan</span>
                    </button>
                    <button onclick="navigate('settings')" class="flex flex-col items-center justify-center w-16 transition-colors ${state.currentView === 'settings' ? 'text-fog-blue' : 'text-gray-400'}">
                        <i class="fas fa-cog text-xl mb-1"></i>
                        <span class="text-[10px] font-semibold">Atur</span>
                    </button>
                </nav>
            `;
        }

        function getDashboardHTML() {
            const today = new Date().toISOString().split('T')[0];
            const currentMonth = today.substring(0, 7);

            let incomeToday = 0;
            let expenseToday = 0;
            let incomeMonth = 0;

            state.transactions.forEach(t => {
                if (t.date === today) {
                    if (t.type === 'income') incomeToday += t.amount;
                    if (t.type === 'expense') expenseToday += t.amount;
                }
                if (t.date.startsWith(currentMonth) && t.type === 'income') {
                    incomeMonth += t.amount;
                }
            });

            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-fog-blue to-[#0e6f90] rounded-3xl p-6 text-white shadow-lg shadow-fog-blue/40 relative overflow-hidden">
                        <i class="fas fa-sun absolute -right-4 -top-4 text-9xl opacity-10 text-fog-yellow"></i>
                        <h2 class="text-lg font-medium opacity-90">Total Pemasukan Bulan Ini</h2>
                        <div class="text-3xl font-extrabold mt-1 mb-4">${formatRupiah(incomeMonth)}</div>
                        <button onclick="navigate('transactions'); openTransactionModal('income')" class="bg-fog-yellow text-fog-dark px-4 py-2 rounded-full font-bold text-sm shadow-md hover:bg-white transition-colors">
                            <i class="fas fa-plus mr-1"></i> Catat Pemasukan
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white rounded-2xl p-4 shadow-soft border border-gray-50 flex flex-col justify-center">
                            <div class="flex items-center gap-2 text-fog-green mb-2">
                                <div class="bg-fog-green/10 p-2 rounded-full"><i class="fas fa-arrow-down"></i></div>
                                <span class="font-semibold text-sm">Masuk Hari Ini</span>
                            </div>
                            <div class="text-xl font-bold text-gray-800">${formatRupiah(incomeToday)}</div>
                        </div>
                        <div class="bg-white rounded-2xl p-4 shadow-soft border border-gray-50 flex flex-col justify-center">
                            <div class="flex items-center gap-2 text-fog-red mb-2">
                                <div class="bg-fog-red/10 p-2 rounded-full"><i class="fas fa-arrow-up"></i></div>
                                <span class="font-semibold text-sm">Keluar Hari Ini</span>
                            </div>
                            <div class="text-xl font-bold text-gray-800">${formatRupiah(expenseToday)}</div>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-4 mt-2">
                            <h3 class="font-bold text-gray-800 text-lg">Transaksi Terbaru</h3>
                            <button onclick="navigate('transactions')" class="text-sm text-fog-blue font-semibold">Lihat Semua</button>
                        </div>
                        <div class="space-y-3">
                            ${getRecentTransactionsListHTML()}
                        </div>
                    </div>
                </div>
            `;
        }

        function getRecentTransactionsListHTML() {
            const sorted = [...state.transactions].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 3);
            if (sorted.length === 0) return `<div class="text-center py-8 text-gray-400 bg-white rounded-2xl border border-dashed border-gray-300">Belum ada transaksi.</div>`;
            return sorted.map(t => getTransactionItemHTML(t, false)).join('');
        }

        function getTransactionItemHTML(t, showActions = true) {
            const isIncome = t.type === 'income';
            const icon = isIncome ? 'fa-hand-holding-usd' : 'fa-shopping-cart';
            const colorClass = isIncome ? 'text-fog-green' : 'text-fog-red';
            const bgClass = isIncome ? 'bg-fog-green/10' : 'bg-fog-red/10';
            const sign = isIncome ? '+' : '-';
            
            let actionsHTML = '';
            if (showActions) {
                actionsHTML = `
                    <div class="flex gap-2 mt-3 pt-3 border-t border-gray-100">
                        ${isIncome ? `<button onclick="previewInvoice('${t.id}')" class="flex-1 bg-blue-50 text-blue-600 py-1.5 rounded-lg text-sm font-semibold hover:bg-blue-100"><i class="fas fa-file-invoice mr-1"></i> Invoice</button>` : ''}
                        <button onclick="editTransaction('${t.id}')" class="flex-1 bg-yellow-50 text-yellow-600 py-1.5 rounded-lg text-sm font-semibold hover:bg-yellow-100"><i class="fas fa-edit"></i> Edit</button>
                        <button onclick="confirmDelete('${t.id}')" class="w-10 bg-red-50 text-red-500 py-1.5 rounded-lg text-sm font-semibold hover:bg-red-100"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            }

            return `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-50 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start">
                        <div class="flex gap-3 items-center">
                            <div class="${bgClass} ${colorClass} w-10 h-10 rounded-full flex items-center justify-center shrink-0">
                                <i class="fas ${icon}"></i>
                            </div>
                            <div>
                                <div class="font-bold text-gray-800">${isIncome ? t.customer : (t.category || 'Pengeluaran')}</div>
                                <div class="text-xs text-gray-500">${formatDate(t.date)} • ${t.notes || '-'}</div>
                            </div>
                        </div>
                        <div class="font-bold ${colorClass} shrink-0 ml-2">
                            ${sign} ${formatRupiah(t.amount)}
                        </div>
                    </div>
                    ${actionsHTML}
                </div>
            `;
        }

        function getTransactionsHTML() {
            const sorted = [...state.transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            return `
                <div class="space-y-4">
                    <div class="flex gap-2 sticky top-0 bg-slate-50/90 backdrop-blur pb-2 z-10 pt-1">
                        <button onclick="openTransactionModal('income')" class="flex-1 bg-fog-green text-white py-3 rounded-xl font-bold shadow-md shadow-fog-green/30 hover:opacity-90 transition-all flex justify-center items-center gap-2">
                            <i class="fas fa-plus-circle"></i> Pemasukan
                        </button>
                        <button onclick="openTransactionModal('expense')" class="flex-1 bg-fog-red text-white py-3 rounded-xl font-bold shadow-md shadow-fog-red/30 hover:opacity-90 transition-all flex justify-center items-center gap-2">
                            <i class="fas fa-minus-circle"></i> Pengeluaran
                        </button>
                    </div>
                    
                    <div class="space-y-3 mt-2">
                        ${sorted.length === 0 ? '<div class="text-center py-12 text-gray-400 bg-white rounded-2xl border border-dashed border-gray-300">Data masih kosong nih. Yuk mulai catat!</div>' : ''}
                        ${sorted.map(t => getTransactionItemHTML(t, true)).join('')}
                    </div>
                </div>
            `;
        }

        function getTransactionModalHTML() {
            return `
                <div id="tx-modal" class="fixed inset-0 bg-black/50 hidden z-50 items-end sm:items-center justify-center opacity-0 transition-opacity duration-300">
                    <div class="bg-white w-full max-w-md sm:rounded-3xl rounded-t-3xl p-6 transform translate-y-full sm:translate-y-0 transition-transform duration-300 shadow-2xl relative max-h-[90vh] overflow-y-auto" id="tx-modal-content">
                        <div class="flex justify-between items-center mb-5">
                            <h2 class="text-xl font-bold text-gray-800" id="tx-modal-title">Catat Transaksi</h2>
                            <button type="button" onclick="closeTransactionModal()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-200">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <form id="tx-form" class="space-y-4">
                            <input type="hidden" id="tx-type" value="">
                            
                            <div id="income-fields" class="hidden space-y-4">
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Pelanggan / Instansi</label>
                                    <input type="text" id="tx-customer" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-fog-blue outline-none" placeholder="Misal: Bapak Andi">
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-1">Alamat Lengkap</label>

        // Action Handlers
        window.navigate = function(view) {
            state.currentView = view;
            window.render();
        };

        window.changeFilterMonth = function(val) {
            state.filterMonth = val;
            window.render();
        };

        window.logout = function() {
            state.isLoggedIn = false;
            window.render();
        };

        window.attachEventListeners = function() {
            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.onsubmit = (e) => {
                    e.preventDefault();
                    const u = document.getElementById('username').value;
                    const p = document.getElementById('password').value;
                    if (u === 'admin' && p === state.appPassword) {
                        state.isLoggedIn = true;
                        state.filterMonth = new Date().toISOString().split('T')[0].substring(0, 7);
                        window.render();
                    } else {
                        document.getElementById('login-error').classList.remove('hidden');
                    }
                };
            }

            const txForm = document.getElementById('tx-form');
            if (txForm) {
                txForm.onsubmit = (e) => {
                    e.preventDefault();
                    window.saveTransaction();
                };
            }
        };

        window.togglePassword = function() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        };

        window.changePassword = async function() {
            const newPwd = document.getElementById('new-password').value;
            if (newPwd.trim() !== '') {
                const btn = document.getElementById('btn-save-pwd');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memperbarui...';
                btn.disabled = true;

                state.appPassword = newPwd;
                await window.saveSettingsToCloud();

                btn.innerHTML = originalText;
                btn.disabled = false;
                document.getElementById('new-password').value = '';

                const msg = document.getElementById('pwd-msg');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 3000);
            }
        };

        window.handleLogoUpload = function(event) {
            const file = event.target.files[0];
            if (file) {
                window.resizeImage(file, async (resizedBase64) => {
                    state.logoUrl = resizedBase64;
                    await window.saveSettingsToCloud();
                    window.render(); 
                });
            }
        };

        window.saveCompanyProfile = async function() {
            const btn = document.getElementById('btn-save-profile');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
            btn.disabled = true;

            state.ownerName = document.getElementById('setting-owner').value;
            state.companyAddress = document.getElementById('setting-address').value;
            
            await window.saveSettingsToCloud();
            
            btn.innerHTML = originalText;
            btn.disabled = false;

            const msg = document.getElementById('profile-msg');
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 3000);
        };

        window.handleSignatureUpload = function(event) {
            const file = event.target.files[0];
            if (file) {
                window.resizeImage(file, async (resizedBase64) => {
                    state.signatureUrl = resizedBase64;
                    await window.saveSettingsToCloud();
                    window.render();
                });
            }
        };

        window.openTransactionModal = function(type, id = null) {
            const modal = document.getElementById('tx-modal');
            const title = document.getElementById('tx-modal-title');
            const typeInput = document.getElementById('tx-type');
            const incomeFields = document.getElementById('income-fields');
            const expenseFields = document.getElementById('expense-fields');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('tx-modal-content').classList.remove('translate-y-full');
            }, 10);

            typeInput.value = type;
            state.editingId = id;

            if (type === 'income') {
                title.innerText = id ? 'Edit Pemasukan' : 'Catat Pemasukan';
                incomeFields.classList.remove('hidden');
                expenseFields.classList.add('hidden');
            } else {
                title.innerText = id ? 'Edit Pengeluaran' : 'Catat Pengeluaran';
                incomeFields.classList.add('hidden');
                expenseFields.classList.remove('hidden');
            }

            if (id) {
                const tx = state.transactions.find(t => t.id === id);
                if (tx) {
                    document.getElementById('tx-amount').value = tx.amount;
                    document.getElementById('tx-date').value = tx.date;
                    document.getElementById('tx-notes').value = tx.notes || '';
                    if (type === 'income') {
                        document.getElementById('tx-customer').value = tx.customer || '';
                        document.getElementById('tx-address').value = tx.address || '';
                    } else {
                        document.getElementById('tx-category').value = tx.category || 'Lainnya';
                    }
                }
            } else {
                document.getElementById('tx-form').reset();
                document.getElementById('tx-date').value = new Date().toISOString().split('T')[0];
            }
        };

        window.closeTransactionModal = function() {
            const modal = document.getElementById('tx-modal');
            modal.classList.add('opacity-0');
            document.getElementById('tx-modal-content').classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
                state.editingId = null;
            }, 300);
        };

        window.saveTransaction = async function() {
            const btn = document.getElementById('btn-save-tx');
            if (btn) {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
                btn.disabled = true;
            }

            const type = document.getElementById('tx-type').value;
            const data = {
                id: state.editingId || generateId(),
                type: type,
                amount: parseFloat(document.getElementById('tx-amount').value),
                date: document.getElementById('tx-date').value,
                notes: document.getElementById('tx-notes').value
            };

            if (type === 'income') {
                data.customer = document.getElementById('tx-customer').value;
                data.address = document.getElementById('tx-address').value;
            } else {
                data.category = document.getElementById('tx-category').value;
            }

            if (state.editingId) {
                const index = state.transactions.findIndex(t => t.id === state.editingId);
                if (index !== -1) state.transactions[index] = data;
            } else {
                state.transactions.push(data);
            }

            // Simpan ke Cloud 
            await window.saveTxToCloud(data);

            window.closeTransactionModal();
            window.render();
        };

        window.editTransaction = function(id) {
            const tx = state.transactions.find(t => t.id === id);
            if (tx) {
                window.openTransactionModal(tx.type, id);
            }
        };

        window.confirmDelete = function(id) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4 fade-in';
            overlay.innerHTML = `
                <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">
                    <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2">Hapus Data?</h3>
                    <p class="text-gray-500 text-sm mb-6">Data transaksi ini akan dihapus permanen dari Cloud.</p>
                    <div class="flex gap-3">
                        <button id="cancel-del" class="flex-1 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition-colors">Batal</button>
                        <button id="confirm-del" class="flex-1 py-3 bg-fog-red text-white font-bold rounded-xl shadow-lg hover:bg-opacity-90 flex justify-center items-center gap-2">Ya, Hapus</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            document.getElementById('cancel-del').onclick = () => overlay.remove();
            document.getElementById('confirm-del').onclick = async () => {
                const btn = document.getElementById('confirm-del');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Proses...';
                btn.disabled = true;

                state.transactions = state.transactions.filter(t => t.id !== id);
                await window.deleteTxFromCloud(id);
                overlay.remove();
                window.render();
            };
        };

        window.previewInvoice = function(id) {
            state.previewTxId = id;
            window.render();
        };

        window.closeInvoicePreview = function() {
            state.previewTxId = null;
            window.render();
        };

        window.executePrint = function(elementId) {
            const content = document.getElementById(elementId).innerHTML;
            const container = document.getElementById('print-container');
            container.innerHTML = content;
            setTimeout(() => {
                window.print();
                setTimeout(() => { container.innerHTML = ''; }, 1000);
            }, 100);
        };

        window.executeDownloadPDF = function(elementId, filename) {
            const originalElement = document.getElementById(elementId);
            
            // Trik Kloning: Membuat tiruan elemen ke mode "Layar Lebar / Desktop"
            // agar hasil PDF tidak berantakan mengikuti sempitnya layar HP pengguna.
            const clone = originalElement.cloneNode(true);
            
            // Buat kontainer tidak terlihat berukuran A4 (800px)
            const container = document.createElement('div');
            container.style.position = 'absolute';
            container.style.left = '-9999px'; 
            container.style.top = '0';
            container.style.width = '800px';  
            container.style.backgroundColor = 'white';
            container.style.padding = '20px'; 
            
            container.appendChild(clone);
            document.body.appendChild(container);

            // Hilangkan mode 'scroll-menyamping' pada tabel khusus saat merender PDF agar isi tidak terpotong
            const tableWrappers = clone.querySelectorAll('.overflow-x-auto');
            tableWrappers.forEach(w => w.classList.remove('overflow-x-auto'));

            const opt = {
                margin:       0.3,
                filename:     filename,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { 
                    scale: 2, 
                    useCORS: true, 
                    windowWidth: 800 // Memaksa deteksi mode Desktop
                },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            
            html2pdf().set(opt).from(container).save().then(() => {
                // Hapus kontainer tersembunyi setelah unduhan selesai
                document.body.removeChild(container);
            });
        };

        // Memulai Aplikasi dan Inisialisasi Firebase Cloud 
        initCloud();

    </script>
</body>
</html>
